services:
  bot:
    image: olymping:${OLYMPING_VERSION:-0.2.3}
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/olymping.db
      DATA_DIR: /app/calendar
    restart: unless-stopped
    mem_limit: ${BOT_MEMORY_LIMIT:-384m}
    mem_reservation: 192m
    pids_limit: 64
    volumes:
      - olymping-data:/app/data
      - ./data/calendar:/app/calendar:ro
    security_opt:
      - no-new-privileges:true

  backup:
    image: olymping:${OLYMPING_VERSION:-0.2.3}
    build: .
    depends_on:
      bot:
        condition: service_healthy
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/olymping.db
    command:
      - python
      - -m
      - olymping.services.backups
      - loop
      - --database-url
      - sqlite+aiosqlite:////app/data/olymping.db
      - --backup-dir
      - /backups
      - --interval-hours
      - "24"
      - --retention-count
      - "14"
    restart: unless-stopped
    mem_limit: ${BACKUP_MEMORY_LIMIT:-64m}
    mem_reservation: 16m
    pids_limit: 16
    volumes:
      - olymping-data:/app/data:ro
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "olymping.services.backups", "fresh", "--backup-dir", "/backups", "--max-age-hours", "26"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  olymping-data:
